{% extends "base.html" %}
{% block title %}Connexion — DistribDZ{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="card border shadow-sm">
      <div class="card-body p-4">
        <h3 class="fw-bold mb-1">DistribDZ</h3>
        <p class="text-muted small mb-4">Réseau B2B des superettes & grossistes en Algérie</p>

        {% if not has_admin %}
        <div class="border rounded p-3 mb-4 bg-light">
          <h6 class="fw-bold mb-2">Configuration initiale Administrateur</h6>
          <form method="post" action="{{ url_for('auth.bootstrap_admin') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="mb-2">
              <input class="form-control form-control-sm" type="text" name="full_name" placeholder="Nom complet" required />
            </div>
            <div class="mb-2">
              <input class="form-control form-control-sm" type="email" name="email" placeholder="Email administrateur" required />
            </div>
            <div class="mb-2">
              <input class="form-control form-control-sm" type="password" name="password" placeholder="Mot de passe (min 6 car.)" required />
            </div>
            <button class="btn btn-success btn-sm w-100" type="submit">Créer le compte Administrateur</button>
          </form>
        </div>
        {% endif %}

        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Mot de passe</label>
            <input type="password" name="password" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-success w-100">Se connecter</button>
        </form>

        <div class="mt-3 text-center small">
          Nouveau producteur ? <a href="{{ url_for('auth.register') }}">Créer un compte</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
