{% extends "base.html" %}
{% block title %}Inscription Producteur — DistribDZ{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card border shadow-sm">
      <div class="card-body p-4">
        <h4 class="fw-bold mb-3">Inscription Producteur</h4>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small">Nom complet</label>
              <input type="text" name="full_name" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small">Usine / Entreprise</label>
              <input type="text" name="company_name" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small">Secteur d'activité</label>
              <input type="text" name="sector" class="form-control" placeholder="Agroalimentaire, Boissons..." />
            </div>
            <div class="col-md-6">
              <label class="form-label small">Wilaya prioritaire</label>
              <select name="preferred_wilaya_id" class="form-select">
                {% for w in wilayas %}
                <option value="{{ w.id }}">{{ w.code }} — {{ w.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small">Email</label>
              <input type="email" name="email" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small">Mot de passe</label>
              <input type="password" name="password" class="form-control" minlength="6" required />
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100 mt-4">Créer mon compte</button>
        </form>
        <div class="mt-3 text-center small">
          Déjà inscrit ? <a href="{{ url_for('auth.login') }}">Connexion</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
