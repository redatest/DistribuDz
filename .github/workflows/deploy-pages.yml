name: Deploy DistribDZ to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: Build Vite application for repository Pages URL
        run: bun run build -- --base=/DistribuDz/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built application
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
